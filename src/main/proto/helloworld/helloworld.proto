syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.service.grpc";
option java_outer_classname = "HelloWorldProto";
option objc_class_prefix = "HLW";

package helloworld;

// The greeting service definition.
service Greeter {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);

  // Endpoint 2: Server-Streaming RPC - Stream transaction history records efficiently
  rpc SayHelloAndGreet (HelloAndGreetRequest) returns (stream HelloAndGreetReply);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}

//-- Datastructure for second end point - SayHelloAndGreet
message HelloAndGreetRequest {
  string name = 1;
  int32 times =2;
}

// The response message containing the greetings and message
message HelloAndGreetReply {
  string message = 1;
  string eofMessage = 2;
}